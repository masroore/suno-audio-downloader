<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suno Audio Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Suno Audio Downloader</h1>
      <p id="status" class="status status-idle">Not connected</p>
    </header>

    <section class="panel">
      <label for="download-path">Downloads folder</label>
      <div class="row">
        <span class="prefix">Downloads/</span>
        <input id="download-path" type="text" value="SunoDownloads" spellcheck="false" />
      </div>
      <p class="hint">
        All files save in one flat folder under Downloads (no subfolders). Disable “Ask where to save each file” for bulk downloads.
      </p>
    </section>

    <section class="panel discovery-options">
      <div>
        <label for="start-input">Start offset</label>
        <input id="start-input" type="number" min="0" value="0" />
      </div>
      <div>
        <label for="count-input">Count</label>
        <input id="count-input" type="number" min="0" value="0" />
        <p class="hint">0 = all remaining</p>
      </div>
      <div>
        <label for="page-size-input">API page size</label>
        <input id="page-size-input" type="number" min="1" max="100" value="50" />
        <p class="hint">1–100; falls back when rejected</p>
      </div>
    </section>

    <section class="actions">
      <button id="btn-connect" type="button">Connect</button>
      <button id="btn-discover" type="button" disabled>Discover</button>
      <button id="btn-download" type="button" disabled>Download all</button>
      <button id="btn-extract-json" type="button" class="secondary" disabled>Extract JSON</button>
      <button id="btn-resume" type="button" class="secondary" disabled hidden>Resume</button>
      <button id="btn-cancel" type="button" class="secondary" disabled>Cancel</button>
    </section>

    <section class="panel progress-panel" id="progress-panel" hidden>
      <p id="progress-text">Idle</p>
      <div class="bar"><div id="progress-bar" class="bar-fill"></div></div>
      <p id="progress-detail" class="hint"></p>
    </section>

    <section class="panel">
      <div class="list-header">
        <h2>Discovered clips</h2>
        <span id="clip-count">0</span>
      </div>
      <div class="select-bar" id="select-bar" hidden>
        <label class="select-all-label">
          <input type="checkbox" id="chk-select-all" />
          Select all
        </label>
        <span id="selected-count" class="hint">0 selected</span>
      </div>
      <ul id="clip-list"></ul>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
